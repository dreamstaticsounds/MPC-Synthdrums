# MPC Synthdrums -- page layout (mpc-vst-plugins layout.conf syntax: tools/shadow_skin.py).
# GENERATED by tools/skin.py --layout: edit that. tools/skin.py then builds every control of the six pages.
theme_bg=121212
theme_panel=121212
theme_ink=f0eeea
theme_ink_dim=bebab6
theme_accent=f28c1e
theme_knob_ring=f28c1e
theme_seg_active=f28c1e

[tab OSC]
knob cx=24 cy=110 r=12 label="" key=src_mix ns=0 bw=30
